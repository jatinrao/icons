name: Publish

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SECURITY: required for `npm publish --provenance` to mint a Sigstore-
      # signed attestation linking the published tarball back to this exact
      # workflow run and commit — https://docs.npmjs.com/generating-provenance-statements
      id-token: write
    # Turso wiring (TURSO_DATABASE_URL/TURSO_AUTH_TOKEN as repo secrets, plus
    # the registry-regeneration step below) is deferred to a later release.
    # Until then this publishes from whatever's already committed in
    # packages/core/src/registry.generated.ts — a release won't pick up icon
    # changes made only in the DB and never regenerated+committed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Bump package versions
        run: |
          pnpm --filter @web-portfolio/icons version ${{ inputs.version_bump }} --no-git-tag-version
          pnpm --filter @web-portfolio/icons-sanity version ${{ inputs.version_bump }} --no-git-tag-version

      - name: Build packages
        run: |
          pnpm --filter @web-portfolio/icons build
          pnpm --filter @web-portfolio/icons-sanity build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @web-portfolio/icons publish --no-git-checks --access public --provenance
          pnpm --filter @web-portfolio/icons-sanity publish --no-git-checks --access public --provenance

      - name: Commit the version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/react/package.json packages/sanity-plugin/package.json
          git commit -m "chore: publish icon packages [skip ci]" || echo "Nothing to commit"
          git push
