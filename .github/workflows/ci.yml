name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # apps/admin and apps/gallery read icons at build time (ISR/static params),
  # so `next build` needs a real (if empty) database to hit — a fresh local
  # libSQL file, migrated + seeded from devicon, keeps this hermetic.
  TURSO_DATABASE_URL: file:${{ github.workspace }}/ci.db

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # All DB-touching unit tests use an in-memory libSQL instance, so this
      # doesn't need the seeded ci.db.
      - run: pnpm test

      - name: Set up a local test database (right before build, which reads it)
        run: |
          pnpm --filter @web-portfolio/icons-db db:migrate
          pnpm --filter @web-portfolio/icons-db seed-all
          pnpm generate-registry

      - run: pnpm build
