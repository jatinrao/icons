name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # apps/admin and apps/gallery read icons at build time (ISR/static params),
  # so `next build` needs a real (if empty) database to hit — a fresh local
  # libSQL file, migrated + seeded from devicon, keeps this hermetic.
  TURSO_DATABASE_URL: file:${{ github.workspace }}/ci.db

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # All DB-touching unit tests use an in-memory libSQL instance, so this
      # doesn't need the seeded ci.db.
      - run: pnpm test

      # Informational only (never blocks CI): our two published packages
      # ship zero real dependencies (verified by verify-package below and
      # package.test.ts), so nothing here can affect what consumers install.
      # Findings are almost always in dev/build tooling or the Next.js apps
      # — surfaced for visibility, not gated on, to avoid noisy failures on
      # advisories we can't act on without an upstream fix.
      - name: Audit dependencies (informational)
        run: pnpm audit --audit-level=critical || true

      - name: Set up a local test database (right before build, which reads it)
        run: |
          pnpm --filter @web-portfolio/icons-db db:migrate
          pnpm --filter @web-portfolio/icons-db seed-all
          pnpm generate-registry

      - run: pnpm build

      # Exercises the actual built tarballs (real ESM/CJS imports, real
      # renders) rather than source or mocks — see packages/*/scripts/verify-package.mjs.
      - name: Verify published package contents
        run: |
          pnpm --filter @web-portfolio/icons verify-package
          pnpm --filter @web-portfolio/icons-sanity verify-package
